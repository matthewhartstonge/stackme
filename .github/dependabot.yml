version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "matthewhartstonge/stackme" # Track latest minor release
        update-types:
          - "version-update:semver-major"

      - dependency-name: "mariadb" # Track LTS patch releases
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      - dependency-name: "nginx" # Track latest release
        update-types:
          - "version-update:semver-major"

      - dependency-name: "varnish" # Track stable release, manual
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "docker/php/8.1"
    schedule:
      interval: "weekly"
    assignees:
      - "matthewhartstonge"
    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "docker"
    directory: "docker/php/8.2"
