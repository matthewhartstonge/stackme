# nginx -> certbot
server {
    listen 80 default_server;
    listen [::]:80;

    server_name _;
    server_tokens off;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
